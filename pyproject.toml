[project]
name = "practice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "hydra-core>=1.3.2",
    "iterative-stratification>=0.1.9",
    "mlflow>=2.20.0,<3.0.0",
    "omegaconf>=2.3.0",
    "optuna>=4.8.0",
    "pandas>=2.0.0,<3.0.0",
    "pillow>=12.1.1",
    "protobuf>=4.21.0,<5.0.0",
    "pycocotools>=2.0.11",
    "timm>=1.0.26",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.26.0",
    "tqdm>=4.66.5",
    "transformers>=5.5.3",
]

[dependency-groups]
eda = [
    "matplotlib>=3.10.8",
]

dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "ruff>=0.15.10",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
